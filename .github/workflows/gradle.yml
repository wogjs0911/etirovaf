name: Java CI with Gradle

on:
  push:
    branches: [ "main", "dev", "dev2", "build/gitactions" ]
  pull_request:
    branches: [ "main", "dev", "dev2", "build/gitactions" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: cd backend && chmod +x ./gradlew

      - name: Make directory for deliver
        run: cd backend && mkdir deploy

      - name: Build with Gradle
        run: cd backend && ./gradlew clean build -x test
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

      - name: Copy jar
        run: cd backend && cp ./build/libs/*.jar ./deploy/

      - name: Create env file
        run: |
          echo MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} >> .env
          echo MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }} >> .env
          echo SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }} >> .env
          echo SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }} >> .env
          echo SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }} >> .env

      # 도커 컴포즈 설정 파일 서버로 전달하기(복사 후 붙여넣기)
      - name: Send docker-compose.yml
        uses: appleboy/scp-action@master
        with:
          username: ec2-user
          host: ${{ secrets.AWS_DEV_HOSTNAME }}
          key: ${{ secrets.AWS_DEV_PRIVATE_KEY }}
          source: "./docker-compose.yml"
          target: "/home/ec2-user/"

      # nginx 설정 파일 서버로 전달하기(복사 후 붙여넣기)
      - name: Send nginx.conf
        uses: appleboy/scp-action@master
        with:
          username: ec2-user
          host: ${{ secrets.AWS_DEV_HOSTNAME }}
          key: ${{ secrets.AWS_DEV_PRIVATE_KEY }}
          source: "./nginx/nginx.conf"
          target: "/home/ec2-user/"

      ## springboot 도커 이미지 빌드 후 도커허브에 push하기
      - name: web springboot docker build and push
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t ${{ secrets.DOCKER_REPOSITORY }}:backend ./backend
          docker push ${{ secrets.DOCKER_REPOSITORY }}:backend

      ## nginx 도커 이미지 빌드 후 도커허브에 push
#      - name: nginx docker build and push
#        run: |
#          cd ./nginx
#          docker build -t ${{ secrets.DOCKER_REPOSITORY }}:nginx .
#          docker push ${{ secrets.DOCKER_REPOSITORY }}:nginx

      ## frontend 도커 이미지 빌드 후 도커허브에 push하기
#      - name: frontend docker build and push
#        run: |
#          cd ./front # frontend 프로젝트 디렉토리로 이동
#          docker build -t ${{ secrets.DOCKER_REPOSITORY }}:frontend .
#          docker push ${{ secrets.DOCKER_REPOSITORY }}:frontend

      ## Docker Hub에서 MySQL 이미지 pull 후 태그 변경 및 push
#      - name: Pull and push MySQL image
#        run: |
#          docker pull mysql # MySQL 최신 버전 이미지 pull
#          docker tag mysql:latest ${{ secrets.DOCKER_REPOSITORY }}:database # 이미지 태그 변경
#          docker push ${{ secrets.DOCKER_REPOSITORY }}:database # 변경된 태그로 push
#
#      ## Docker Hub에서 Redis 이미지 pull 후 태그 변경 및 push
#      - name: Pull and push Redis image
#        run: |
#          docker pull redis # Redis 최신 버전 이미지 pull
#          docker tag redis:latest ${{ secrets.DOCKER_REPOSITORY }}:redis # 이미지 태그 변경
#          docker push ${{ secrets.DOCKER_REPOSITORY }}:redis # 변경된 태그로 push

      # Install dependencies
#      - name: Install dependencies
#        run: sudo apt-get update && sudo apt-get install -y libcrypt1

      # nginx.conf 경로 변경 후 도커 컴포즈 실행
      # 도커 허브에서 jar파일 및 pull후에 컴포즈 up
      - name: Deploy to Dev
        uses: appleboy/ssh-action@master
        with:
          username: ec2-user
          host: ${{ secrets.AWS_DEV_HOSTNAME }}
          key: ${{ secrets.AWS_DEV_PRIVATE_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            sudo docker pull ${{ secrets.DOCKER_REPOSITORY }}:database
            sudo docker pull ${{ secrets.DOCKER_REPOSITORY }}:redis
            sudo docker pull ${{ secrets.DOCKER_REPOSITORY }}:backend
            sudo docker pull ${{ secrets.DOCKER_REPOSITORY }}:frontend
            sudo docker pull ${{ secrets.DOCKER_REPOSITORY }}:nginx
            cd /home/ec2-user
            sudo cp /home/ec2-user/nginx/nginx.conf /home/ec2-user/nginx/nginx.conf.bak
            docker-compose down
            docker rmi $(docker images -q) || true
            docker-compose up -d

